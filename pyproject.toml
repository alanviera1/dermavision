[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dermavision"
version = "0.1.0"
description = "Sistema Experto de Análisis Dermocosmético Cuantitativo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pillow>=10.3",
    "opencv-python-headless>=4.10",
    "scikit-image>=0.24",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
vision = [
    "torch>=2.3",
    "torchvision>=0.18",
    "ultralytics>=8.2",
    "mediapipe>=0.10",
    "timm>=1.0",
    "albumentations>=1.4",
]
data = [
    "dvc[s3]>=3.0",
    "huggingface_hub>=0.24",
    "roboflow>=1.1",
]
presentation = [
    "google-generativeai>=0.7",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.9",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dermavision"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/dermavision"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
